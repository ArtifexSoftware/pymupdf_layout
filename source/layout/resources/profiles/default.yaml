# Default profile for BoxRFDGNN.
#
# Mirrors rf2.4.1+imf1.yaml, which was the implicit default before profiles
# were introduced (feature_set_name='imf+rf' resolved to these same files).
# Kept as a separate file (rather than referenced/aliased) since profile
# inheritance is not implemented; if rf2.4.1+imf1.yaml changes, update this
# file to match.

feature_set_name: imf+rf

config_filename: layout_rf2.4.1+imf1.yaml
model_filename: layout_rf2.4.1+imf1.onnx

imf_model_filename: feature_imf1.onnx
table_grid_path: null

table_grid_model_ver: V1
input_type: null

use_gpu: false
use_sort: false
