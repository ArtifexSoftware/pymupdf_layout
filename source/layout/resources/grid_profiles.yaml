# Table grid extractor configurations, keyed by table_grid_model_ver.
#
# Each entry corresponds to one previously hardcoded tuple in
# BoxRFDGNN.__init__ (GRID_MODEL_CONFIGS):
#   (ExtractorClass, filename, connection_mode, h_thresh, v_thresh, nms_min_dist)
#
# Fields:
#   extractor_class:  string key into GRID_EXTRACTOR_REGISTRY (BoxRFDGNN.py)
#   filename:         default onnx filename under resources/onnx/, used when
#                      table_grid_path is not explicitly given
#   connection_mode:  true  -> a separate table_grid_model_v2_conn.onnx is
#                               loaded as the connection model
#                     false -> no connection model, plain constructor call
#                     null  -> conn_onnx_path is passed explicitly as None
#   h_on_threshold, v_on_threshold: extractor thresholds
#   nms_min_dist:     optional, omit or set null if not applicable
#
# The alias 'V4' (used as table_grid_model_ver='V4') maps to 'V4-EP' in code.

V1:
  extractor_class: TableGridExtractor
  filename: table_grid_model_v1.onnx
  connection_mode: false
  h_on_threshold: 0.3
  v_on_threshold: 0.35
  nms_min_dist: null

V1A:
  extractor_class: TableGridExtractorV1A
  filename: table_grid_model_v1a.onnx
  connection_mode: false
  h_on_threshold: 0.15
  v_on_threshold: 0.2
  nms_min_dist: null

